          import asyncio, os, sys, json
          from playwright.async_api import async_playwright
          sys.path.insert(0, os.path.dirname(__file__)); import stories
          B = os.environ.get('BOOKS', '/home/claude/sahaf-store/books').rstrip('/') + '/'; OUT = os.environ.get('OUT', '/home/claude/sahaf-store/shots').rstrip('/') + '/'; os.makedirs(OUT, exist_ok=True)
          APP = os.environ.get('APP', 'http://localhost:8765/')
