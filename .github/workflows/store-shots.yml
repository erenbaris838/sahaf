                  man, spine, nav = ['<item id="css" href="style.css" media-type="text/css"/>', '<item id="cover" href="cover.jpg" media-type="image/jpeg" properties="cover-image"/>', '<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>'], [], []
                  for i, (ct, body) in enumerate(chapters, 1):
                      z.writestr(f'OEBPS/c{i}.xhtml', xhtml(ct, body, lang), compress_type=D)
                      man.append(f'<item id="c{i}" href="c{i}.xhtml" media-type="application/xhtml+xml"/>'); spine.append(f'<itemref idref="c{i}"/>')
                      nav.append(f'<li><a href="c{i}.xhtml">{html.escape(ct)}</a></li>')
                  z.writestr('OEBPS/nav.xhtml', xhtml('Contents', '<nav epub:type="toc"><ol>' + ''.join(nav) + '</ol></nav>', lang), compress_type=D)
                  z.writestr('OEBPS/content.opf', f'<?xml version="1.0" encoding="utf-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="uid">urn:sahaf:{name}</dc:identifier><dc:title>{html.escape(title)}</dc:title><dc:creator>{html.escape(author)}</dc:creator><dc:language>{lang}</dc:language><meta property="dcterms:modified">2026-11-01T00:00:00Z</meta></metadata><manifest>{"".join(man)}</manifest><spine>{"".join(spine)}</spine></package>', compress_type=D)

          # localized sample stories
          PAL = [((24, 52, 74), (245, 236, 214), (214, 170, 92))]
          for lang, s in stories.S.items():
              paras = s['text'].split('\n')
              def body(k, ct):
                  ps = ''.join(f'<p{" class=\"first\"" if j == 0 else ""}>{html.escape(p)}</p>' for j, p in enumerate(paras))
                  return f'<section epub:type="chapter"><h2 class="n">{k}</h2><h1>{html.escape(ct)}</h1>{ps}</section>'
              chs = [(ct, body(k, ct)) for k, ct in enumerate(s['chapters'], 1)]
              build(f'sample-{lang}.epub', s['title'], stories.AUTHOR, lang, chs, cover(s['title'], stories.AUTHOR, (24, 52, 74), (245, 236, 214), (214, 170, 92), cjk=lang in ('ja', 'zh'), style=1))

          # public-domain classics (texts from the NLTK Gutenberg corpus)
          CL = [('carroll-alice.txt', "Alice's Adventures in Wonderland", 'Lewis Carroll', ((178, 64, 58), (252, 240, 225), (247, 200, 120)), 2),
                ('austen-emma.txt', 'Emma', 'Jane Austen', ((52, 92, 78), (244, 238, 220), (205, 178, 120)), 0),
                ('melville-moby_dick.txt', 'Moby-Dick', 'Herman Melville', ((22, 40, 66), (232, 236, 240), (120, 170, 200)), 1),
                ('austen-persuasion.txt', 'Persuasion', 'Jane Austen', ((120, 84, 140), (248, 240, 248), (230, 200, 230)), 0),
                ('chesterton-thursday.txt', 'The Man Who Was Thursday', 'G. K. Chesterton', ((30, 30, 34), (240, 220, 160), (200, 160, 60)), 2),
                ('austen-sense.txt', 'Sense and Sensibility', 'Jane Austen', ((196, 150, 90), (60, 40, 25), (120, 80, 40)), 0),
                ('chesterton-brown.txt', 'The Innocence of Father Brown', 'G. K. Chesterton', ((92, 56, 40), (246, 228, 200), (214, 160, 100)), 1),
                ('milton-paradise.txt', 'Paradise Lost', 'John Milton', ((16, 60, 54), (230, 240, 230), (150, 200, 170)), 2),
                ('whitman-leaves.txt', 'Leaves of Grass', 'Walt Whitman', ((90, 120, 60), (248, 248, 230), (220, 230, 170)), 0),
                ('shakespeare-hamlet.txt', 'Hamlet', 'William Shakespeare', ((110, 22, 34), (248, 232, 220), (220, 150, 120)), 1)]
          for fn, title, author, (bg, fg, ac), st in CL:
              txt = open(GUT + fn, encoding='latin-1').read()
              parts = re.split(r'\n(?=(?:CHAPTER|Chapter|BOOK|Book|ACT|Actus)\s+[\dIVXLC]+\.?)', txt)
              if len(parts) < 3: parts = [txt[i:i + 30000] for i in range(0, len(txt), 30000)]
              chs = []
              for k, part in enumerate(parts[:60], 1):
                  lines = part.strip().split('\n')
                  head = lines[0].strip()[:60] if re.match(r'(CHAPTER|Chapter|BOOK|Book|ACT|Actus)', lines[0]) else f'{k}'
                  paras = [re.sub(r'\s+', ' ', p).strip() for p in '\n'.join(lines[1:] if head != f'{k}' else lines).split('\n\n')]
                  paras = [p for p in paras if p]
                  chs.append((head.title() if head.isupper() else head, f'<section><h1>{html.escape(head)}</h1>' + ''.join(f'<p>{html.escape(p)}</p>' for p in paras) + '</section>'))
              build(re.sub(r'\W+', '-', title.lower()).strip('-') + '.epub', title, author, 'en', chs, cover(title, author, bg, fg, ac, style=st))
          print(sorted(os.listdir(OUT)))
