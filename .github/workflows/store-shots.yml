          OUT = os.environ.get('BOOKS', '/home/claude/sahaf-store/books'); os.makedirs(OUT, exist_ok=True)
          GUT = os.environ.get('GUT', '/tmp/claude-0/-home-claude/1854e050-5273-51c6-9af1-26a5d1abcb72/scratchpad/gut/gutenberg/')
          fm = lambda q: subprocess.run(['fc-match', '-f', '%{file}', q], capture_output=True, text=True).stdout.strip()
          LORA = fm('Lora:bold'); CJK = fm('Noto Serif CJK JP:bold'); INTER = fm('Inter:semibold')
          CJK_IDX = int(subprocess.run(['fc-match', '-f', '%{index}', 'Noto Serif CJK JP:bold'], capture_output=True, text=True).stdout.strip() or 0)
          def font(path, size, idx=0, bold=True):
              f = ImageFont.truetype(path, size, index=idx)
              if 'Lora' in path:
                  try: f.set_variation_by_name('Bold' if bold else 'Regular')
                  except Exception: pass
              return f
          def wrap(d, text, f, maxw):
              words = list(text) if re.search(r'[぀-鿿]', text) else text.split()
              sep = '' if re.search(r'[぀-鿿]', text) else ' '
              lines, cur = [], ''
              for w in words:
                  t = (cur + sep + w) if cur else w
                  if d.textlength(t, font=f) <= maxw: cur = t
                  else: lines.append(cur); cur = w
              if cur: lines.append(cur)
              return lines
          def cover(title, author, bg, fg, accent, cjk=False, style=0):
              W, H = 600, 900
              im = Image.new('RGB', (W, H), bg); d = ImageDraw.Draw(im)
              # soft vertical gradient
              for y in range(H):
                  k = y / H * 0.22
                  d.line([(0, y), (W, y)], fill=tuple(int(c * (1 - k)) for c in bg))
              if style == 0:
                  d.rectangle([34, 34, W - 34, H - 34], outline=accent, width=3)
                  d.rectangle([46, 46, W - 46, H - 46], outline=accent, width=1)
              elif style == 1:
                  d.rectangle([0, H - 210, W, H - 200], fill=accent)
                  d.ellipse([W / 2 - 70, 110, W / 2 + 70, 250], outline=accent, width=4)
              else:
                  for i in range(7): d.line([(0, 140 + i * 18), (W, 90 + i * 18)], fill=accent, width=2)
              tf = font(CJK, 64, CJK_IDX) if cjk else font(LORA, 64)
              lines = wrap(d, title, tf, W - 140)
              while len(lines) > 4:
                  tf = font(CJK, tf.size - 6, CJK_IDX) if cjk else font(LORA, tf.size - 6); lines = wrap(d, title, tf, W - 140)
              lh = tf.size * 1.18; y0 = (H - lh * len(lines)) / 2 - 30
              for i, ln in enumerate(lines):
                  d.text((W / 2, y0 + i * lh), ln, font=tf, fill=fg, anchor='ma')
              d.line([(W / 2 - 40, y0 + lh * len(lines) + 26), (W / 2 + 40, y0 + lh * len(lines) + 26)], fill=accent, width=3)
              af = font(CJK, 28, CJK_IDX) if cjk else font(INTER, 26)
              d.text((W / 2, H - 120 if style != 1 else H - 160), author.upper() if not cjk else author, font=af, fill=fg, anchor='ma')
              b = io.BytesIO(); im.save(b, 'JPEG', quality=88); return b.getvalue()
          def xhtml(title, body, lang):
              return f'<?xml version="1.0" encoding="utf-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="{lang}" xml:lang="{lang}"><head><title>{html.escape(title)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body>{body}</body></html>'
          CSS = 'body{font-family:"Bitstream Charter",Charter,Georgia,"Noto Serif CJK JP","Noto Serif CJK SC",serif}h1{font-family:Lora,Georgia,"Noto Serif CJK JP","Noto Serif CJK SC",serif;font-weight:600;text-align:center;font-size:1.55em;margin:1.2em 0 .3em}h2.n{font-family:Inter,"Segoe UI",sans-serif;text-align:center;font-size:.72em;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.6;margin:2.4em 0 0}p{margin:0;text-indent:1.4em;line-height:1.5}p.first{text-indent:0}p.first::first-letter{font-size:3.1em;float:left;line-height:.85;margin:.06em .08em 0 0;font-family:Lora,Georgia,serif}'
          def build(name, title, author, lang, chapters, cover_bytes):
              with zipfile.ZipFile(os.path.join(OUT, name), 'w') as z:
                  z.writestr(zipfile.ZipInfo('mimetype'), 'application/epub+zip', compress_type=zipfile.ZIP_STORED)
                  D = zipfile.ZIP_DEFLATED
                  z.writestr('META-INF/container.xml', '<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>', compress_type=D)
                  z.writestr('OEBPS/style.css', CSS, compress_type=D)
