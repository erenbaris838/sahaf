          # progress per title (pct), None = new; order of "recently read" follows list order (last = most recent)
          PROG = {'Hamlet': 1.0, 'Leaves of Grass': None, 'Paradise Lost': None, 'The Innocence of Father Brown': 0.08, 'Sense and Sensibility': None,
                  'The Man Who Was Thursday': 0.41, 'Persuasion': 0.27, 'Moby-Dick': 0.12, 'Emma': 1.0, "Alice's Adventures in Wonderland": 0.64}
          NAMES = ['1-okuma', '2-kitaplik', '3-gorunum', '4-icindekiler', '5-arama']
          LANGS = sys.argv[1:] or list(stories.S)
          async def ready(pg):
              await pg.wait_for_function('window.__sahaf.R.doc && !window.__sahaf.R.busy', timeout=20000); await pg.wait_for_timeout(700)
          async def one(b, lang):
              s = stories.S[lang]
              ctx = await b.new_context(viewport={'width': 1280, 'height': 720}, device_scale_factor=1.5, locale={'zh': 'zh-CN', 'pt': 'pt-BR'}.get(lang, lang), color_scheme='light')
              cjk = lang in ('ja', 'zh')
              settings = {'theme': 'light', 'size': 125 if cjk else 110, 'font': 'pub', 'lh': 0, 'margin': 'm', 'layout': 'paged', 'spread': 'auto', 'justify': True}
              await ctx.add_init_script(f"try{{localStorage.setItem('sahaf-lang', {json.dumps(json.dumps(lang))}); if(!localStorage.getItem('sahaf-settings')) localStorage.setItem('sahaf-settings', {json.dumps(json.dumps(settings))});}}catch(e){{}}")
              pg = await ctx.new_page()
              await pg.goto(APP); await pg.wait_for_timeout(500)
              await pg.set_input_files('#fileIn', [B + c + '.epub' for c in CLASSICS]); 
              await pg.wait_for_function('document.querySelectorAll(".card").length >= 10', timeout=60000)
              await pg.set_input_files('#fileIn', B + f'sample-{lang}.epub'); await ready(pg)
              await pg.click('#rBack'); await pg.wait_for_timeout(400)
              await pg.evaluate('''async (PROG) => {
                const all = await __sahaf.DB.all(); const now = Date.now(); const order = Object.keys(PROG);
                for (const r of all) {
                  const k = order.indexOf(r.title);
                  if (k < 0) { r.opened = now; r.progress = { i: 0, frac: 0, pct: 0.07, href: 'OEBPS/c1.xhtml' }; }
                  else { const p = PROG[r.title]; r.opened = p == null ? 0 : now - (order.length - k) * 3600e3; r.added = now - 90 * 86400e3 + k * 1000; r.progress = p == null ? null : { i: 0, frac: 0, pct: p }; }
                  await __sahaf.DB.put('books', r);
                }
              }''', PROG)
              await pg.reload(); await pg.wait_for_timeout(900)
              # 2: library
              await pg.mouse.move(5, 700)
              await pg.screenshot(path=OUT + f'{lang}-{NAMES[1]}.png')
              # 1: reading, two-page spread
              await pg.click('.card >> nth=0'); await ready(pg)
              await pg.screenshot(path=OUT + f'{lang}-{NAMES[0]}.png')
              await pg.click('#rBack'); await pg.wait_for_timeout(600)
              # 3: sepia + display settings
              await pg.click('.card >> nth=0'); await ready(pg)
              await pg.click('#rAa'); await pg.click('#thSel button[data-v="sepia"]'); await pg.wait_for_timeout(600)
              await pg.screenshot(path=OUT + f'{lang}-{NAMES[2]}.png')
              await pg.keyboard.press('Escape')
              # 4: dark + contents
              await pg.click('#rAa'); await pg.click('#thSel button[data-v="dark"]'); await pg.keyboard.press('Escape'); await pg.wait_for_timeout(300)
              await pg.keyboard.press('ArrowRight'); await pg.wait_for_timeout(300)
              await pg.click('#rToc'); await pg.wait_for_timeout(600)
              await pg.screenshot(path=OUT + f'{lang}-{NAMES[3]}.png')
              await pg.keyboard.press('Escape'); await pg.click('#scrim') if await pg.is_visible('#scrim') else None
              # 5: search, light
              await pg.click('#rAa'); await pg.click('#thSel button[data-v="light"]'); await pg.keyboard.press('Escape'); await pg.wait_for_timeout(300)
              await pg.keyboard.press('Home'); await pg.wait_for_timeout(200)
              await pg.click('#rSearch'); await pg.fill('#sInput', s['search']); await pg.press('#sInput', 'Enter'); await pg.wait_for_timeout(1500)
              await pg.click('#sList button.it >> nth=1'); await ready(pg)
              await pg.screenshot(path=OUT + f'{lang}-{NAMES[4]}.png')
